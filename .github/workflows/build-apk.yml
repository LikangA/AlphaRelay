name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Show environment
        run: |
          echo "== pwd =="; pwd
          echo "== root =="; ls -la
          echo "== app =="; ls -la app || echo "!!! app 目录不存在 !!!"
          echo "== java =="; java -version
          echo "== sdk =="; echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AlphaRelay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
